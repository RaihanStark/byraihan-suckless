<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Description}}">
  <link rel="canonical" href="{{.Canonical}}">
  <meta property="og:type" content="{{.OGType}}">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="{{.Description}}">
  <meta property="og:url" content="{{.Canonical}}">
  <meta property="og:site_name" content="Raihan Yudo Saputra">
  <meta property="og:image" content="{{.OGImage}}">
  <meta name="twitter:card" content="{{.TwitterCard}}">
  <meta name="twitter:title" content="{{.Title}}">
  <meta name="twitter:description" content="{{.Description}}">
  <meta name="twitter:image" content="{{.OGImage}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png">
  <link rel="alternate" type="application/atom+xml" title="Raihan Yudo Saputra" href="/atom.xml">
  <link rel="stylesheet" href="/style.css" type="text/css">
</head>
<body>
<div class="page">

<header class="pageheader">
<div class="header">
<span>
<span class="parentlinks">{{.ParentLinks}}</span>
{{- if .HasH1}}<span class="title">{{.HeaderTitle}}</span>{{else}}<h1 class="title">{{.HeaderTitle}}</h1>{{end}}
</span>
</div>
</header>

<div id="pagebody">
<main id="content">
{{.Body}}
</main>
</div>

<footer id="footer" class="pagefooter">
<div id="pageinfo">
<div class="bottom_menu">
Raihan Yudo Saputra | <a href="/atom.xml">RSS</a>
</div>
<div class="last_edit">__PAGE_WEIGHT_INFO__</div>
</div>
</footer>

</div>
</body>
</html>
